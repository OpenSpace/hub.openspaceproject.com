# Apache virtual host for the hub, like www. and tools.openspaceproject.com (Apache on RHEL with
# a Let's Encrypt certificate). Apache handles HTTPS and passes everything to the hub process
# that pm2 runs on port 3000, which serves the API, the admin panel and the frontend.
#
# Install as /etc/httpd/conf.d/hub.openspaceproject.com.conf, then:
#   sudo setsebool -P httpd_can_network_connect 1   # SELinux: let Apache connect to port 3000
#   sudo apachectl configtest && sudo systemctl reload httpd
#   sudo certbot --apache -d hub.openspaceproject.com
# certbot adds the HTTPS (:443) copy of this host with the certificate, and redirects HTTP to it.

<VirtualHost *:80>
    ServerName hub.openspaceproject.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    # Bundle uploads can be up to 512 MB (MAX_BUNDLE_BYTES in AssetBundles.ts); this leaves room
    # for the upload form's other fields. Keep it above that limit
    LimitRequestBody 600000000
    # Give large uploads time to arrive and be checked
    ProxyTimeout 600
</VirtualHost>
